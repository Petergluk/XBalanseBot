# XBalanseBot/render.yaml
# v1.3.2 - 2025-08-20 (Corrected YAML syntax based on official documentation)
# 2025-08-20 20:45:00
# https://render.com/docs/blueprint-spec

databases:
  - name: xbbot-db
    region: frankfurt
    plan: free

# --- ГРУППА ПЕРЕМЕННЫХ ОКРУЖЕНИЯ ---
# В настройках Render (вкладка Environment) создайте группу с таким же именем
# и добавьте туда BOT_TOKEN, MAIN_GROUP_ID, SUPER_ADMIN_ID, TRIBUTE_WEBHOOK_SECRET и CRON_JOB_SECRET.
envVarGroups:
  - name: xbalansebot-secrets
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MAIN_GROUP_ID
        sync: false
      - key: SUPER_ADMIN_ID
        sync: false
      - key: TRIBUTE_WEBHOOK_SECRET
        sync: false
      - key: CRON_JOB_SECRET
        generateValue: true # Render сгенерирует случайное значение при первом деплое

services:
  # Основной сервис для ответов бота
  - type: web
    name: xbalansebot-app
    runtime: python
    region: frankfurt
    branch: master
    plan: free
    rootDir: .
    buildCommand: "poetry install --no-root --without dev"
    startCommand: ".venv/bin/python main.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: POETRY_VERSION
        value: 2.1.3
      - key: DEV_MODE
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: xbbot-db
          property: connectionString
      - key: WEBHOOK_HOST
        value: xbalansebot-app.onrender.com
      # ИСПРАВЛЕННЫЙ СИНТАКСИС: используется 'fromGroup'
      - fromGroup: xbalansebot-secrets

  # Cron Job для "пробуждения" основного сервиса
  - type: cron
    name: xbalansebot-waker
    region: frankfurt
    # ИСПРАВЛЕНИЕ: Убраны 'runtime', 'plan', 'branch', 'rootDir' - они не поддерживаются для Cron Job
    schedule: "*/14 * * * *" # Каждые 14 минут
    startCommand: "curl -X POST -H \"X-Cron-Secret: $CRON_JOB_SECRET\" https://$WEBHOOK_HOST/webhook/cron || true"
    envVars:
      - key: WEBHOOK_HOST
        value: xbalansebot-app.onrender.com
      # ИСПРАВЛЕННЫЙ СИНТАКСИС: используется 'fromGroup' для получения секрета
      - fromGroup: xbalansebot-secrets