# XBalanseBot/render.yaml
# v1.3.1 - 2025-08-20 (Fixed YAML syntax for Cron Job and Env Group)
# 2025-08-20 20:10:00
# https://render.com/docs/blueprint-spec

databases:
  - name: xbbot-db
    region: frankfurt
    plan: free

# --- ГРУППА ПЕРЕМЕННЫХ ОКРУЖЕНИЯ ---
# Чтобы не дублировать секреты, создадим группу.
# В настройках Render (вкладка Environment) создайте группу с таким же именем
# и добавьте туда BOT_TOKEN, MAIN_GROUP_ID, SUPER_ADMIN_ID, TRIBUTE_WEBHOOK_SECRET и CRON_JOB_SECRET.
envVarGroups:
  - name: xbalansebot-secrets
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MAIN_GROUP_ID
        sync: false
      - key: SUPER_ADMIN_ID
        sync: false
      - key: TRIBUTE_WEBHOOK_SECRET
        sync: false
      - key: CRON_JOB_SECRET
        generateValue: true # Render сгенерирует случайное значение при первом деплое

services:
  # Основной сервис для ответов бота
  - type: web
    name: xbalansebot-app
    runtime: python
    region: frankfurt
    branch: master
    plan: free
    rootDir: .
    buildCommand: "poetry install --no-root --without dev"
    startCommand: ".venv/bin/python main.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: POETRY_VERSION
        value: 2.1.3
      - key: DEV_MODE
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: xbbot-db
          property: connectionString
      - key: WEBHOOK_HOST
        value: xbalansebot-app.onrender.com
      - fromEnvGroup: xbalansebot-secrets # ИСПРАВЛЕННЫЙ СИНТАКСИС

  # Cron Job для "пробуждения" основного сервиса
  - type: cron
    name: xbalansebot-waker
    region: frankfurt
    # ИСПРАВЛЕНИЕ: Убраны runtime и plan, так как они не поддерживаются для Cron Job
    schedule: "*/14 * * * *" # Каждые 14 минут
    startCommand: "curl -X POST -H \"X-Cron-Secret: $CRON_JOB_SECRET\" https://$WEBHOOK_HOST/webhook/cron || true"
    envVars:
      - key: WEBHOOK_HOST
        value: xbalansebot-app.onrender.com
      - fromEnvGroup: xbalansebot-secrets # ИСПРАВЛЕННЫЙ СИНТАКСИС