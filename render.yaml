# XBalanseBot/render.yaml - данные для развертывания XBalanseBot на Render.com
# https://render.com/docs/blueprint-spec

# Сначала определяем все базы данных, которые нам нужны.
databases:
  - name: xbbot-db      # Имя, по которому мы будем обращаться к базе внутри этого файла.
    region: frankfurt
    plan: free         # Тарифный план.

# Затем определяем все наши сервисы (приложения, воркеры и т.д.).
services:
  - type: web
    name: xbalansebot-app # Имя сервиса, станет частью публичного URL.
    runtime: python
    region: frankfurt
    branch: master       # Ветка в Git, за которой нужно следить.
    plan: free
    rootDir: . # <-- корневая директория проекта

    # Команды для сборки и запуска проекта.
    buildCommand: "poetry install --no-root --without dev"
    startCommand: ".venv/bin/python main.py" 

    # Переменные окружения для render.com
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: POETRY_VERSION
        value: 2.1.3        
      - key: DEV_MODE
        value: False
      - key: DATABASE_URL
        # Берем строку подключения из базы данных 'xbbot-db', определенной выше.
        fromDatabase:
          name: xbbot-db
          property: connectionString         
      - key: WEBHOOK_HOST
        value: xbalansebot-app.onrender.com          
        fromService:
          type: web
          name: xbalansebot-app
          property: host